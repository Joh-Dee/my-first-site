<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Thingyan </title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(to bottom, #a8e6ff, #ffd6e0);
  overflow-x: hidden;
}

/* Profile */
.profile {
  margin-top: 40px;
}

.profile img {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 4px solid white;
  object-fit: cover;
}

h1 {
  color: white;
}

/* Countdown */
#countdown {
  font-size: 20px;
  color: white;
  margin-top: 10px;
}

/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 20px;
}

.gallery img {
  width: 100%;
  border-radius: 10px;
}

/* Splash */
.splash {
  position: absolute;
  width: 20px;
  height: 20px;
  background: rgba(0,150,255,0.5);
  border-radius: 50%;
  animation: splash 0.6s ease-out;
}

@keyframes splash {
  to {
    transform: scale(6);
    opacity: 0;
  }
}

/* Message overlay */
.overlay {
  position: fixed;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  transition: 0.6s;
}

.overlay.active {
  top: 0;
}

.box {
  background: #ffffff22;
  padding: 20px;
  border-radius: 10px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
}

/* Music button */
#musicBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: white;
}
</style>
</head>

<body>

<div class="profile">
  <img src="img11.jpg" alt="crush">
  <h1>Happy Thingyan </h1>
  <div id="countdown"></div>
</div>

<div class="gallery">
  <img src="img12.jpg">
  <img src="img13.jpg">
  <img src="img14.jpg">
  <img src="img15.jpg">
  <img src="img16.jpg">
  <img src="img17.jpg">
  <img src="img18.jpg">
  <img src="img19.jpg">
  <img src="img20.jpg">
</div>

<div id="overlay" class="overlay">
  <div class="box">
    <h2>ကိုယ့်အပေါ်မှာ အမြဲချိုပေးခဲ့တဲ့ချိုရေ... ကျေးဇူးတင်ပါတယ်။ </h2>
    <button onclick="closeMsg()">Close</button>
  </div>
</div>

<audio id="music" src="song1.mp3"></audio>
<button id="musicBtn" onclick="toggleMusic()">Play</button>

<script>
let clickCount = 0;

// Click splash + message
window.addEventListener("click", function(e) {
  // Splash
  let splash = document.createElement("div");
  splash.className = "splash";
  splash.style.left = e.pageX + "px";
  splash.style.top = e.pageY + "px";
  document.body.appendChild(splash);

  setTimeout(() => splash.remove(), 600);

  clickCount++;

  if(clickCount === 2){
    document.getElementById("overlay").classList.add("active");
  }
});

function closeMsg(){
  document.getElementById("overlay").classList.remove("active");
}

// Music control
let music = document.getElementById("music");
let btn = document.getElementById("musicBtn");

function toggleMusic(){
  if(music.paused){
    music.play();
    btn.innerText = "Pause";
  } else {
    music.pause();
    btn.innerText = "Play";
  }
}

// Countdown (Thingyan - April 13)
let target = new Date(new Date().getFullYear(), 3, 13);

function updateCountdown(){
  let now = new Date();
  let diff = target - now;

  if(diff < 0) return;

  let days = Math.floor(diff / (1000*60*60*24));
  let hours = Math.floor((diff / (1000*60*60)) % 24);
  let mins = Math.floor((diff / (1000*60)) % 60);

  document.getElementById("countdown").innerText =
    days + " days " + hours + " hrs " + mins + " mins";
}

setInterval(updateCountdown, 1000);
</script>

</body>
</html>
